name: Deploy Zudoku Dalin DOCs Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Zudoku docs
        run: npm run build

      - name: Mirror routes into "<path>/index.html" for static hosting
        # Zudoku writes every route as a flat "<path>.html" file. Our
        # nginx/Apache static host doesn't rewrite extensionless URLs to
        # ".html" (so a hard load of e.g. /napoveda/index 404s), and for
        # routes that also have nested sub-routes (e.g. the OpenAPI
        # reference roots /api, /oris-api) it auto-redirects bare "/api" to
        # "/api/" and then 403s because that directory has no index.html.
        # Mirroring every "<path>.html" into "<path>/index.html" lets the
        # host's own directory+index handling resolve both the bare path
        # (via auto-redirect) and the trailing-slash path.
        run: |
          find dist -name "*.html" | while read -r f; do
            rel="${f#dist/}"
            case "$rel" in
              index.html|400.html|404.html|500.html) continue ;;
            esac
            dir="${f%.html}"
            mkdir -p "$dir"
            if [ ! -f "$dir/index.html" ]; then
              cp "$f" "$dir/index.html"
            fi
          done

      - name: Configure SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          SSHPASS: ${{ secrets.SSH_USER_PASSWORD }}
          SSH_USER: ${{ secrets.SSH_USER_NAME }}
          SSH_HOST: ${{ secrets.SSH_SERVER_NAME }}
        run: |
          sshpass -e rsync -av -e "ssh -p 20001 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" ./dist/ "$SSH_USER@$SSH_HOST:/home/html/multi_731459/dalin.cz/_sub/docs"
